spring.application.name=travel_management_system

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# JPA / Hibernate
spring.jpa.open-in-view=false

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${ACCESS_TOKEN_EXPIRATION_MS}
jwt.refresh-token-expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS}

# Rate limiting
rate-limit.login.max-attempts=${LOGIN_MAX_ATTEMPTS}
rate-limit.login.window-ms=${LOGIN_WINDOW_MS}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# OpenAPI / Swagger UI
springdoc.api-docs.version=openapi_3_1

# Email verification
email-verification.validity-hours=${VALIDITY_HOURS}
email-verification.resend-cooldown-seconds=${RESEND_COOLDOWN_SECONDS}