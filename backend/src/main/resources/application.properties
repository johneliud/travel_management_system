spring.application.name=travel_management_system

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# JPA / Hibernate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# OpenAPI / Swagger UI
springdoc.api-docs.version=openapi_3_1
springdoc.swagger-ui.title=Travel Management System API
springdoc.swagger-ui.version=0.0.1-SNAPSHOT
springdoc.swagger-ui.description=Travel Management System Backend API
springdoc.swagger-ui.path=/swagger-ui.html