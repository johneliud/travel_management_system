@if (error()) {
  <div class="mb-4 px-4 py-3 rounded-(--radius-md) bg-(--color-error-light) text-(--color-error) text-sm">
    {{ error() }}
  </div>
}

<form (submit)="$event.preventDefault(); onSubmit()" class="space-y-4" novalidate>
  <p class="text-sm text-(--color-text-secondary)">
    Enter your email and we'll send you a code to reset your password.
  </p>

  <div>
    <label for="forgot-email" class="block text-sm font-medium text-(--color-text-secondary) mb-1">Email</label>
    <input
      id="forgot-email"
      type="email"
      [value]="email()"
      (input)="email.set($any($event.target).value)"
      (blur)="markTouched('email')"
      name="forgotEmail"
      required
      [class]="emailError ? 'border-(--color-error)' : ''"
      class="w-full px-4 py-2.5 border border-(--color-border) rounded-(--radius-md) text-sm text-(--color-text) placeholder:text-(--color-text-disabled) outline-none"
      placeholder="you@example.com"
      autocomplete="email"
    />
    @if (emailError) {
      <p class="mt-1 text-xs text-(--color-error)">{{ emailError }}</p>
    }
  </div>

  <button
    type="submit"
    [disabled]="loading()"
    class="w-full py-2.5 px-4 bg-(--color-primary) hover:bg-(--color-primary-hover) disabled:opacity-50 text-(--color-text-inverse) font-medium rounded-(--radius-md) transition-colors flex items-center justify-center gap-2"
  >
    @if (loading()) {
      <svg lucideLoaderCircle [size]="18" class="animate-spin" />
    }
    Send Reset Code
  </button>
</form>
