@if (error()) {
  <div class="mb-4 px-4 py-3 rounded-(--radius-md) bg-(--color-error-light) text-(--color-error) text-sm">
    {{ error() }}
  </div>
}

@if (success()) {
  <div class="mb-4 px-4 py-3 rounded-(--radius-md) bg-(--color-success-light) text-(--color-success) text-sm">
    {{ success() }}
  </div>
}

<form (submit)="$event.preventDefault(); onSubmit()" class="space-y-4">
  @if (userEmail()) {
    <p class="text-sm text-(--color-text-secondary)">
      Enter the 6-digit code sent to <strong>{{ userEmail() }}</strong>.
    </p>
  } @else {
    <p class="text-sm text-(--color-text-secondary)">
      Enter the 6-digit verification code sent to your email.
    </p>
  }
  <div>
    <label for="verify-otp" class="block text-sm font-medium text-(--color-text-secondary) mb-1">Verification Code</label>
    <input
      id="verify-otp"
      type="text"
      [ngModel]="otp()"
      (ngModelChange)="otp.set($event)"
      name="verifyOtp"
      required
      pattern="^\d{6}$"
      maxlength="6"
      class="w-full px-4 py-2 border border-(--color-border) rounded-(--radius-md) text-sm text-(--color-text) text-center tracking-widest text-lg outline-none"
      placeholder="00000"
      autocomplete="one-time-code"
    />
  </div>
  <button
    type="submit"
    [disabled]="loading()"
    class="w-full py-2.5 px-4 bg-(--color-primary) hover:bg-(--color-primary-hover) disabled:opacity-50 text-(--color-text-inverse) font-medium rounded-(--radius-md) transition-colors flex items-center justify-center gap-2"
  >
    @if (loading()) {
      <svg lucideLoaderCircle [size]="18" class="animate-spin" />
    }
    Verify
  </button>
</form>
